<!DOCTYPE html>
<html lang="fr">
<head>

<style>

.streamerCard{background:linear-gradient(180deg,#06213a,#03101f);border:1px solid #008fe0;border-radius:13px;text-align:center;padding:24px 18px;min-width:0}
.streamerCard img{width:120px;height:120px;object-fit:cover;border-radius:50%;border:3px solid #a647ff;margin:12px auto;display:block}
.streamerCard h2{font-size:21px;margin:8px 0}.streamerCard p{color:#cde6fa}
.streamerCard a{display:block;margin-top:10px;padding:12px;border-radius:8px;background:linear-gradient(90deg,#250054,#07568a);border:1px solid #20baff;color:white;text-decoration:none;font-weight:900}

<nav class="navbar"><a class="brand" href="index.html"><img src="assets/wolf-logo.png" alt="Logo RDM"><span>RDM</span></a><a class="twitchBtn" href="index.html">Retour au site</a></nav>
